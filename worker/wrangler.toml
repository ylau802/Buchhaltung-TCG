name = "yingway-sync"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Wird von  wrangler kv namespace create DB  gefüllt:
[[kv_namespaces]]
binding = "DB"
id = "89e6489134074ceaba2d4f0c1b5b3c1e"

# Optional, für PDF-Belege. Wird von  wrangler r2 bucket create yingway-files  gefüllt
# (siehe SETUP-SYNC.md) – ohne diesen Block laufen Vault-Sync weiter, nur Belege nicht.
# R2 ist im Konto noch nicht freigeschaltet (Dashboard -> R2 -> aktivieren,
# danach  wrangler r2 bucket create yingway-files  und die drei Zeilen wieder einkommentieren):
#[[r2_buckets]]
#binding = "FILES"
#bucket_name = "yingway-files"

# News-Monitor: alle 5 Minuten die nächsten Shops prüfen.
[triggers]
crons = ["*/5 * * * *"]

# Mail-Empfänger und Resend-Key sind Secrets (Repo ist öffentlich):
#   wrangler secret put NEWS_TO          (kommagetrennt, z. B. bruder@x.ch)
#   wrangler secret put RESEND_API_KEY
# Absender optional als Variable NEWS_FROM (nur mit verifizierter Domain nötig).
