# GitHub Pages veroeffentlichen. Die Pages-Quelle des Repos steht auf
# "GitHub Actions" - ohne diesen Workflow wird bei einem Push nichts neu
# gebaut und die Seite bleibt auf einem alten Stand stehen.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laeufe nicht abbrechen, damit ein angefangener Deploy fertig wird.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .          # statische Seite, nichts zu bauen
      - id: deployment
        uses: actions/deploy-pages@v4
